name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore API and tests
        run: |
          dotnet restore src/PowerQuality.Api/PowerQuality.Api.csproj
          dotnet restore tests/PowerQuality.UnitTests/PowerQuality.UnitTests.csproj
          dotnet restore tests/PowerQuality.IntegrationTests/PowerQuality.IntegrationTests.csproj
      - name: Build API
        run: dotnet build src/PowerQuality.Api/PowerQuality.Api.csproj -c Release --no-restore
      - name: Unit tests
        run: dotnet test tests/PowerQuality.UnitTests/PowerQuality.UnitTests.csproj -c Release --no-restore
      - name: Integration tests
        run: dotnet test tests/PowerQuality.IntegrationTests/PowerQuality.IntegrationTests.csproj -c Release --no-restore

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build WPF client
        run: dotnet build src/PowerQuality.Desktop/PowerQuality.Desktop.csproj -c Release
